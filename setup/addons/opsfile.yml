version: "3"

env:
  OPS_ADDON_PROVIDER: '{{._provider_}}'
  OPS_ADDON_COMPONENT: '{{._component_}}'
  OPS_ADDON_ADOPT: '{{.__adopt}}'
  OPS_ADDON_UNINSTALL: '{{.__uninstall}}'
  OPS_ADDON_KUBECONFIG: '{{.__kubeconfig}}'
  OPS_ADDON_TIMEOUT: '{{.__timeout}}'

tasks:
  ingress:
    desc: install the pinned ingress-nginx chart for a provider
    silent: true
    cmds:
      - bun addons.ts ingress "$OPS_ADDON_PROVIDER"

  cert-manager:
    desc: install the pinned cert-manager chart and preserve its CRDs
    silent: true
    cmds:
      - bun addons.ts cert-manager

  render:
    desc: render the pinned chart without connecting to Kubernetes
    silent: true
    cmds:
      - bun addons.ts render "$OPS_ADDON_COMPONENT" "$OPS_ADDON_PROVIDER"

  images:
    desc: list the images required by the pinned chart and its hooks
    silent: true
    cmds:
      - bun addons.ts images "$OPS_ADDON_COMPONENT" "$OPS_ADDON_PROVIDER"

  download:
    desc: cache and verify the pinned chart without connecting to Kubernetes
    silent: true
    cmds:
      - bun addons.ts download "$OPS_ADDON_COMPONENT" "$OPS_ADDON_PROVIDER"
