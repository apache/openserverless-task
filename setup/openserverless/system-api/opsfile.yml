version: '3'

vars:
  VAR: ""
  MSG: ""
  VAL: ""
  RETRY: 100
  TIMEOUT: 15s
  CONTEXT: ""

env:

  KUBECONFIG:
    sh: |
      if test -e "$OPS_TMP/kubeconfig"
      then echo "$OPS_TMP/kubeconfig"
      else echo ~/.kube/config
      fi

  SYS_API_CDB_HOST: couchdb

  SYS_API_CDB_USER:
    #sh: ops util kubectl -- --kubeconfig "$KUBECONFIG" -n openserverless get wsk/controller -o jsonpath='{.spec.couchdb.admin.user}'
    sh: ops util kubeget wsk/controller .spec.couchdb.admin.user

  SYS_API_CDB_PASSWORD:
    #sh: ops util kubectl -- --kubeconfig "$KUBECONFIG" -n openserverless get wsk/controller -o jsonpath='{.spec.couchdb.admin.password}'
    sh: ops util kubeget wsk/controller .spec.couchdb.admin.password

  SYS_API_HOSTNAME:
    #sh: ops util kubectl -- --kubeconfig "$KUBECONFIG" -n openserverless get ingress/apihost -o jsonpath='{.spec.rules[0].host}'
    sh: ops util kubeget ingress/apihost .spec.rules[0].host

  REGISTRY_PASS:
    #sh: ops util kubectl -- --kubeconfig "$KUBECONFIG" -n openserverless get cm/config  -o jsonpath='{.metadata.annotations.registry_password}'
    sh: ops util kubeget cm/config .metadata.annotations.registry_password

  INGRESS_TYPE:
    sh: ops util ingress-type

tasks:
  install-toml:
    desc: Update the buildkitd.toml file config map
    silent: true
    cmds:
      - task: remove-toml
      - kubectl -n openserverless create configmap openserverless-buildkitd-conf --from-file="$OPS_ROOT/setup/openserverless/system-api/deploy/buildkit/buildkitd.toml"

  remove-toml:
    desc: Remove the buildkitd.toml config map
    silent: true
    cmds:
      - |
        if kubectl -n openserverless get cm openserverless-buildkitd-conf >/dev/null 2>&1;
          then kubectl -n openserverless delete configmap openserverless-buildkitd-conf
        fi

  install-secret:
    desc: Create secret to push to internal registry
    silent: true
    cmds:
      - task: remove-secret
      - |
        if ! kubectl -n openserverless get secret registry-pull-secret-int >/dev/null 2>&1;
        then kubectl -n openserverless create secret docker-registry registry-pull-secret-int --docker-server=http://openserverless-registry-svc:5000 --docker-username=opsuser --docker-password=${REGISTRY_PASS}
        fi

  remove-secret:
    desc: Delete secret to push to internal registry
    silent: true
    cmds:
      - |
        if kubectl -n openserverless get secret registry-pull-secret-int >/dev/null 2>&1;
        then kubectl -n openserverless delete secret registry-pull-secret-int
        fi

  deploy:
    silent: true
    ignore_error: false
    desc: deploy the admin api
    cmds:
    - test -e ${INGRESS_TYPE}-template.yaml || die "No avalable template for ingress type ${INGRESS_TYPE}."
    - test -n "$IMAGES_SYSTEMAPI" || die "IMAGES_SYSTEMAPI is not set. Please set it to the desired image version."
    - envsubst -i api-template.yaml -o _api.yaml > /dev/null 2>&1
    - envsubst -i ${INGRESS_TYPE}-template.yaml -o _ingress.yaml > /dev/null 2>&1
    - kubectl -n openserverless apply -f "$OPS_ROOT/setup/openserverless/system-api/_api.yaml"
    #- cat _ingress.yaml
    - kubectl -n openserverless apply -f "$OPS_ROOT/setup/openserverless/system-api/_ingress.yaml"
    - task: install-toml
    - task: install-secret
    - |
      echo "Admin API deployed with HOSTNAME: ${SYS_API_HOSTNAME}/system"

  undeploy:
    silent: true
    desc: undeploy the admin api
    ignore_error: false
    cmds:
    - task: remove-secret
    - task: remove-toml
    - kubectl -n openserverless delete sts/openserverless-system-api ing/openserverless-system-api-ingress svc/openserverless-system-api
    - |
      echo "System Admin API undeployed"


  update:
    silent: true
    desc: update the OpenServerless System Admin Api Stateful Set
    cmds:
      - task: deploy
      - kubectl -n openserverless rollout restart statefulset openserverless-system-api
    preconditions:
      - sh: '[ $IMAGES_SYSTEMAPI != $CURRENT_API_VERSION ]'
        msg: "Current OpenServerless System API stateful set it is already updated to newest version. Request ignored."
    env:
      CURRENT_API_VERSION:
        sh: |
          echo $(kubectl -n openserverless get sts/openserverless-system-api -ojsonpath='{.spec.template.spec.containers[0].image}')