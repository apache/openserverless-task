<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenServerless Landing</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background-color: white;
            text-align: center;
        }

        img {
            max-width: 300px;
        }

        h2 {
            margin-top: 40px;
            font-size: 20px;
        }

        .contact-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .github {
            background-color: #24292f;
        }

        .mailinglist {
            background-color: #6c757d;
        }

        .website {
            background-color: #0a7d64;
        }

        .button img {
            width: 20px;
            height: 20px;
        }

        .contact-note {
            color: #555;
            font-size: 14px;
            margin: 0 auto 24px;
            max-width: 600px;
        }

        .contact-note a {
            color: #0a7d64;
        }

        .textarea-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .install-box {
            width: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .install-box label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        textarea {
            width: 90%;
            height: 60px;
            font-family: monospace;
            font-size: 14px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: none;
        }
    </style>
</head>

<body>
    <h1>Welcome to</h1>
    <img src="os-logo-full-vertical-bg-white.png" alt="OpenServerless Logo" />

    <h2>Get in touch</h2>

    <div class="contact-row">
        <a class="button github" href="https://github.com/apache/openserverless" target="_blank" rel="noopener">
            GitHub
        </a>
        <a class="button mailinglist" href="https://lists.apache.org/list.html?dev@openserverless.apache.org"
            target="_blank" rel="noopener">
            Mailing List
        </a>
        <a class="button website" href="https://openserverless.apache.org/" target="_blank" rel="noopener">
            Website
        </a>
    </div>

    <p class="contact-note">
        Browse the archives at
        <a href="https://lists.apache.org/list.html?dev@openserverless.apache.org" target="_blank" rel="noopener">lists.apache.org</a>.
        To subscribe, send an empty email to
        <a href="mailto:dev-subscribe@openserverless.apache.org?subject=subscribe">dev-subscribe@openserverless.apache.org</a>
        and reply to the confirmation message. Afterwards you can post to
        <a href="mailto:dev@openserverless.apache.org">dev@openserverless.apache.org</a>.
    </p>
</body>

</html>
