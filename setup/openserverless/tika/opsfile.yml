version: "3"

vars:
  ACTION: "apply"
  DRY: ""

env:
  TIKA_IMAGE:
    sh: echo $IMAGES_TIKA
  KUBECONFIG:
    sh: |-
      if test -e "$OPS_TMP/kubeconfig"
      then echo "$OPS_TMP/kubeconfig"
      else echo ~/.kube/config
      fi

tasks:

  deploy:
    silent: true
    desc: deploy tika
    cmds:
      - echo tika=$TIKA_IMAGE
      - envsubst -i tika.yaml -o _tika.yaml
      - >
        {{.DRY}} kubectl -n openserverless {{.ACTION}} -f _tika.yaml
      - >
        {{.DRY}} ops setup kubernetes wait OBJECT=po/tika-0 COND=true

  undeploy:
    silent: true
    desc: uninstall trustable
    ignore_error: true
    cmds:
    - >
       {{.DRY}} kubectl -n openserverless delete
       sts/tika svc/tika cm/tika-config
