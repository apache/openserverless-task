# Optional feature permissions. Apply only when enabling user provisioning.
# Change the binding subject if Admin API uses a different service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openserverless-user-provisioning
  namespace: openserverless
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [openserverless-user-provisioning-token]
    verbs: [get]
  - apiGroups: [openserverless.org]
    resources: [whisks]
    resourceNames: [controller]
    verbs: [get]
  - apiGroups: [openserverless.org]
    resources: [whisksusers]
    verbs: [get, create]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    resourceNames: [apihost]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [create]
  - apiGroups: [traefik.io]
    resources: [middlewares]
    verbs: [create]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [openserverless-streamer-api]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openserverless-user-provisioning
  namespace: openserverless
subjects:
  - kind: ServiceAccount
    name: openserverless-wsku
    namespace: openserverless
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openserverless-user-provisioning
