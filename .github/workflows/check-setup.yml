name: Check setup readiness

on:
  pull_request:
    paths:
      - .github/workflows/check-setup.yml
      - config/components.ts
      - config/components.test.ts
      - setup/cluster-ready.ts
      - setup/cluster-ready.test.ts
      - setup/opsfile.yml

permissions:
  contents: read

jobs:
  readiness:
    name: Task readiness regression tests
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install checksum-pinned Bun 1.3.14
        run: |
          curl --fail --location --retry 3 \
            https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip \
            --output "$RUNNER_TEMP/bun.zip"
          echo "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  $RUNNER_TEMP/bun.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Test component dependencies and setup readiness
        run: bun test config/components.test.ts setup/cluster-ready.test.ts
