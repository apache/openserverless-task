name: Check setup readiness

on:
  pull_request:
    paths:
      - .github/workflows/check-setup.yml
      - config/components.ts
      - config/components.test.ts
      - setup/cluster-ready.ts
      - setup/cluster-ready.test.ts
      - setup/opsfile.yml

permissions:
  contents: read

jobs:
  readiness:
    name: Task readiness regression tests
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Test component dependencies and setup readiness
        run: bun test config/components.test.ts setup/cluster-ready.test.ts
